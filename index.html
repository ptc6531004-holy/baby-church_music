<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영아부 찬양 리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--fg:#1A2330;--muted:#5B6675;--line:#D9DEE5;--accent:#A8392A;--accent-fg:#FFFFFF;
  --font-display:"Nanum Myeongjo","Noto Serif KR",serif;--font-body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#11161D;--surface:#1A212B;--fg:#E8ECF1;--muted:#9AA5B4;--line:#2B3441;--accent:#E5806B;--accent-fg:#1A0F0C;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#11161D;--surface:#1A212B;--fg:#E8ECF1;--muted:#9AA5B4;--line:#2B3441;--accent:#E5806B;--accent-fg:#1A0F0C;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-block:40px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.kicker{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:700}
h1{font-family:var(--font-display);font-size:clamp(28px,7vw,38px);line-height:1.25;margin:4px 0 8px;text-wrap:balance}
.lead{margin:0;color:var(--muted)}
.pl{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:16px;padding:14px 20px;border-radius:10px}
.pl:hover{filter:brightness(1.08)}
.pl:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.pl svg{width:14px;height:14px;fill:currentColor}
input{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ol{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
li{display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.num{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--accent);min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.title{font-weight:500;font-size:17px;line-height:1.4;overflow-wrap:anywhere;flex:1;min-width:0}
a.title{color:var(--fg);text-decoration:none}
a.title:hover{color:var(--accent);text-decoration:underline}
a.title:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.go{flex:none;color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.go:hover{text-decoration:underline}
.chain{display:flex;flex-wrap:wrap;gap:10px}
.chain a{flex:1 1 200px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
</style>
</head>
<body>
<main>
  <header>
    <span class="kicker">영아부</span>
    <h1>영아부 찬양 리스트</h1>
    <p class="lead">아이와 함께 들어 주세요. 아래 버튼을 누르면 YouTube 재생목록에서 전체 찬양을 들을 수 있습니다.</p>
  </header>
  <a id="pl" class="pl" target="_blank" rel="noopener" hidden><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1l11 6-11 6z"/></svg>YouTube 재생목록 열기</a>
  <div id="chain" class="chain" hidden></div>
  <input id="q" type="search" placeholder="곡 제목 검색" aria-label="곡 제목 검색">
  <ol id="list"></ol>
  <p id="empty" class="empty" hidden>검색 결과가 없습니다.</p>
</main>
<script>
var links={}; /* 정확한 영상 주소는 곡 번호(0부터)별로: links[0]="https://www.youtube.com/watch?v=영상ID"; */
var ids=["wKOq0ft1zb4","_vNLyG7eejs","v45pKvt1lwY","1SSq0zifrh4","TpRjKGBQj1Y","qmn_-HU9nWk","76BrWl7R_r0","4uxjCBKKwE0","47YNYdDLmUQ","MZXcLOhvGSM","CaPJwE8kiQg","n43hbxbRPjw","9lNHzt-C4po","T_ZAnIk8KDY","DKgISW0L49c","yPLhjp50hTk","q19M_Re-e3U","Fi3M7LUDpgU","s2GAigl4IFs","JH-SFmjo8uE","rx8Q_cE5iss","qsS3Ol129E8","IkqlVCCPfW0","XWkzrbV9WpI","g7V4j7EKvZA","V7hgehzynFM","HDUXOcseqL8","nzuwyLeM1Xk","BxwLlHnkxxM","bh25rWbr9Ro","b8nno8ZbsAE","UGzlt7D0R4w","iYkTtV6STac","6IP1b9xFYHY","I5GlcObMiEo","J-JB7e6KC0E","p6O2bS64DNo","NoB_jz9F1Ps","11b__f-73WY","uRBs4xh9acI","XbJyPOQ0zPk","YmCbeinhElk","lr_a6yvYynI","MMhL74HW8fU","seZSUgUhf9s","UudKRvNGS9c","YuaNniLyyrg"]; /* 영상 ID를 곡 번호(0부터)별로: ids[0]="영상ID"; 채우면 곡 링크와 이어 듣기 버튼이 자동 적용됩니다 */
var playlistUrl=""; /* 공유할 YouTube 재생목록 주소를 여기에 넣으세요 */
var songs=["예수님 사랑하는 어린이","그래도 내 친구","한걸음 또 한걸음","팡팡 나눠줘요","하나님 저 왔어요","매일 매일 찬양해","또또","눈눈눈 성경보고요","따라 따라","태초에 하나님이","하나님 지켜주세요","뼝뼝뼝뼝","하나님 만드신 세상","버려요","하나님의 능력 알고있니?","사순절의 시간","우리들은 작은 선교사","따라 찬양해요","오직 예수님","다시 사셨네 예수님","너는 꽃이야","끝까지 기다려요","예수님은 나의 왕","모세처럼 말씀 따라","멋진 하늘아 파란 바다야","하나님의 사랑 이야기","구름처럼","천국에 들어가는 길은","꼭 필요한 사람","엄마 아빠 사랑해요","홀리 탐험대","나는야 주의 어린이","일어나요 찬양해요","믿음의 눈으로 바라보아요","함께 떠나요","하나님 우리 왕","주님께 돌아갑니다 (기도송)","앗 뜨거워","하나님의 약속은","Go Go Go","아에이오우","약속을 이루시는","주님께 감사","다니엘처럼","크고 강하신 하나님","반짝반짝 내 믿음","나의 예수님"];
var ol=document.getElementById("list"),empty=document.getElementById("empty"),pl=document.getElementById("pl");
if(playlistUrl){pl.href=playlistUrl;pl.hidden=false}
songs.forEach(function(t,i){
  var li=document.createElement("li");li.dataset.t=t.toLowerCase();
  var url=links[i]||(ids[i]?"https://www.youtube.com/watch?v="+ids[i]:"https://www.youtube.com/results?search_query="+encodeURIComponent(t+" 어린이 찬양"));
  li.innerHTML='<span class="num">'+(i+1)+'</span><a class="title" target="_blank" rel="noopener"></a><a class="go" target="_blank" rel="noopener">▶ 재생</a>';
  li.querySelector(".title").textContent=t;
  Array.prototype.forEach.call(li.querySelectorAll("a"),function(a){a.href=url;a.setAttribute("aria-label",t+" 유튜브에서 재생")});
  ol.appendChild(li);
});
var chain=document.getElementById("chain");
for(var s=0;s<songs.length;s+=20){
  var e=Math.min(s+20,songs.length),g=[];
  for(var k=s;k<e;k++){if(ids[k])g.push(ids[k])}
  if(g.length){var b=document.createElement("a");b.className="pl";b.target="_blank";b.rel="noopener";
    b.href="https://www.youtube.com/watch_videos?video_ids="+g.join(",");
    b.textContent="▶ "+(s+1)+"~"+e+"번 이어 듣기";chain.appendChild(b);chain.hidden=false}
}
document.getElementById("q").addEventListener("input",function(e){
  var v=e.target.value.trim().toLowerCase(),n=0;
  Array.prototype.forEach.call(ol.children,function(li){var s=li.dataset.t.indexOf(v)>-1;li.hidden=!s;if(s)n++});
  empty.hidden=n>0;
});
</script>
</body>
</html>
